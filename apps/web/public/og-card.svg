<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Inter, DejaVu Sans, sans-serif">
  <defs>
    <radialGradient id="glow" cx="0.72" cy="0.5" r="0.62">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#6d28d9" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#121214" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="label" cx="0.38" cy="0.32" r="0.78">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </radialGradient>
    <linearGradient id="vinyl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#26262b"/>
      <stop offset="100%" stop-color="#131315"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#121214"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Record -->
  <g transform="translate(890 315)">
    <circle r="212" fill="url(#vinyl)"/>
    <g fill="none" stroke="#ffffff" stroke-opacity="0.055">
      <circle r="196"/><circle r="180"/><circle r="164"/><circle r="148"/>
      <circle r="132"/><circle r="116"/><circle r="100"/>
    </g>
    <circle r="70" fill="url(#label)"/>
    <circle r="9" fill="#121214"/>
  </g>

  <!-- Wordmark. "Chorusify", not "Chorus" — the card was still carrying the old name. -->
  <text x="96" y="286" fill="#ffffff" font-size="104" font-weight="800" letter-spacing="-3">Chorusify</text>

  <!-- Tagline covers the whole game, not just the daily: most shared links are rooms and
       artist challenges, and "a daily music guessing game" described none of them. -->
  <text x="100" y="348" fill="#9aa0aa" font-size="34" font-weight="500">Guess the song from a few seconds of audio</text>

  <!-- Mode strip, so the card says there is more here than one puzzle a day. -->
  <g font-size="23" font-weight="600">
    <g transform="translate(100 400)">
      <rect width="176" height="46" rx="23" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.10"/>
      <text x="88" y="30" fill="#cbd2dc" text-anchor="middle">Artist Mode</text>
    </g>
    <g transform="translate(292 400)">
      <rect width="182" height="46" rx="23" fill="#06b6d4" fill-opacity="0.12" stroke="#06b6d4" stroke-opacity="0.35"/>
      <text x="91" y="30" fill="#67e8f9" text-anchor="middle">Multiplayer</text>
    </g>
    <g transform="translate(490 400)">
      <rect width="128" height="46" rx="23" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.10"/>
      <text x="64" y="30" fill="#cbd2dc" text-anchor="middle">Duels</text>
    </g>
  </g>

  <!-- Waveform -->
  <g fill="#8b5cf6" transform="translate(100 486)">
    <rect x="0"  y="22" width="13" height="34" rx="6.5"/>
    <rect x="24" y="8"  width="13" height="62" rx="6.5"/>
    <rect x="48" y="0"  width="13" height="78" rx="6.5"/>
    <rect x="72" y="14" width="13" height="50" rx="6.5"/>
    <rect x="96" y="26" width="13" height="26" rx="6.5"/>
  </g>
</svg>
