<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/disc.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Chorusify - guess the song from a growing snippet. A free daily music-guessing game." />
  <meta property="og:title" content="Chorusify - snippet type" />
  <meta property="og:description"
    content="Hear a growing snippet of a song and guess it in as few listens as possible." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="/" />
  <meta property="og:site_name" content="Chorusify" />
  <!-- Absolute at request time: crawlers do not resolve relative og:image paths. The server
       rewrites this (and the title/description above) per route when a link is shared. -->
  <meta property="og:image" content="/og-card.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="/og-card.png" />
  <meta name="twitter:title" content="Chorusify - snippet type" />
  <meta name="twitter:description"
    content="Hear a growing snippet of a song and guess it in as few listens as possible." />
  <title>Chorusify - snippet type</title>
  <!-- Inter font from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
